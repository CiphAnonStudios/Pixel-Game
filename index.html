<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Testing</title>
        <style>
            body {
                margin:0;
                height:100vh;
                display:flex;
                justify-content:center;
                align-items:center;
                background:#111;
                overflow:hidden;
            }
            
            #character {
                width:300px;
                height:auto;
                image-rendering:pixelated;
                user-select:none;
                -webkit-user-drag:none;
                transition:none;
            }
        </style>
    </head>
    <body>
        <img id="character" src="ToonyTimeForward.png" alt="Character"/>
        <script>
            const character = document.getElementById("character");

            const images = {
                forward: "ToonyTimeForward.png",
                right: "ToonyTimeTurn1.png"
            };

            let currentDirection = "forward";
            
            function setDirection(direction) {
                currentDirection = direction;

                if (direction === "left") {
                    character.src = images.right;
                    character.style.transform = "scaleX(-1)";
                } else if (direction === "right") {
                    character.src = images.right;
                    character.style.transform = "scaleX(1)";
                } else {
                    character.src = images.forward;
                    character.style.transform = "scaleX(1)";
                }
            }

            document.addEventListener("keydown", (e) => {
                const key = e.key.toLowerCase();

                if (key === "a") setDirection("left");
                if (key === "d") setDirection("right");
                if (key === "s") setDirection("forward");
            });
        </script>
    </body>
</html>
