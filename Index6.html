<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Testing</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            position: relative;
            background: #111;
            overflow: hidden;
        }

        /* The wrapper is what stays in the same position */
        #character-container {
            position: absolute;
            left: 0;
            top: 0;
            width: 300px;
            height: auto;
            overflow: visible;
        }

        #character {
            display: block;
            width: 300px;
            height: auto;
            image-rendering: pixelated;
            user-select: none;
            -webkit-user-drag: none;

            /* Keeps the bottom of the image anchored */
            transform-origin: bottom center;
        }
    </style>
</head>

<body>

<div id="character-container">
    <img id="character" src="ToonyTimeForward.png" alt="Character"/>
</div>

<script>
    const character = document.getElementById("character");
    const container = document.getElementById("character-container");

    const images = {
        forward: "ToonyTimeForward.png",
        crouch: "ToonyTimeCrouch.png",
        right: "ToonyTimeTurn1.png"
    };

    let currentDirection = "forward";
    let isTurning = false;
    let isCrouching = false;
    let crouchTimer = null;

    let x = window.innerWidth / 2;
    let y = window.innerHeight - 300;
    let velocityY = 0;

    const speed = 4;
    const gravity = 0.8;
    const jumpPower = -16;
    const groundY = window.innerHeight - 300;

    const keys = {
        a: false,
        d: false,
        s: false,
        w: false,
        space: false
    };

    let isOnGround = true;

    // -------------------------
    // IDLE BOB / SQUASH
    // -------------------------

    let idleTime = 0;

    // 2px is the maximum amount the TOP moves down.
    // The bottom does not move.
    const idleAmount = 2;

    const idleSpeed = 0.08;

    function noButtonsPressed() {
        return (
            !keys.a &&
            !keys.d &&
            !keys.s &&
            !keys.w &&
            !keys.space
        );
    }

    function updateIdleAnimation() {

        if (noButtonsPressed() && isOnGround && !isCrouching) {

            idleTime += idleSpeed;

            /*
                Goes smoothly between:

                Normal:
                scaleY(1)

                Squashed:
                scaleY(~0.99)

                Because transform-origin is bottom center,
                the bottom stays in exactly the same place.
            */

            const amount = (Math.sin(idleTime) + 1) / 2;

            const scaleY =
                1 - (amount * 0.01);

            character.style.transform =
                `scaleY(${scaleY})`;

        } else {

            idleTime = 0;

            // Return to completely normal size.
            character.style.transform = "scaleY(1)";
        }
    }

    // -------------------------
    // DIRECTION
    // -------------------------

    function applyDirection(direction) {

        if (isCrouching) {
            character.src = images.crouch;
            character.style.transform = "scaleX(1)";
            return;
        }

        currentDirection = direction;

        if (direction === "left") {

            character.src = images.right;

            character.style.transform =
                "scaleX(-1)";

        } else if (direction === "right") {

            character.src = images.right;

            character.style.transform =
                "scaleX(1)";

        } else {

            character.src = images.forward;

            character.style.transform =
                "scaleX(1)";
        }
    }

    function setDirection(direction) {

        if (isTurning || isCrouching) return;

        const isSwitchingSide =
            (currentDirection === "left" && direction === "right") ||
            (currentDirection === "right" && direction === "left");

        if (isSwitchingSide) {

            isTurning = true;

            character.src = images.forward;
            character.style.transform = "scaleX(1)";

            setTimeout(() => {

                applyDirection(direction);

                isTurning = false;

            }, 16);

        } else {

            applyDirection(direction);
        }
    }

    // -------------------------
    // GAME LOOP
    // -------------------------

    function update() {

        if (!isCrouching) {

            if (keys.a) {
                x -= speed;
                setDirection("left");
            }

            if (keys.d) {
                x += speed;
                setDirection("right");
            }
        }

        // Gravity
        velocityY += gravity;
        y += velocityY;

        if (y >= groundY) {

            y = groundY;
            velocityY = 0;
            isOnGround = true;

        } else {

            isOnGround = false;
        }

        // Position the wrapper.
        // The wrapper itself never moves during idle animation.
        container.style.left = x + "px";
        container.style.top = y + "px";

        // Animate only the image.
        updateIdleAnimation();

        requestAnimationFrame(update);
    }

    // -------------------------
    // KEY DOWN
    // -------------------------

    document.addEventListener("keydown", (e) => {

        const key = e.key.toLowerCase();

        if (key === "a") keys.a = true;
        if (key === "d") keys.d = true;
        if (key === "s") keys.s = true;
        if (key === "w") keys.w = true;

        if (e.code === "Space") {
            keys.space = true;
        }

        // Crouch
        if (key === "s" && !crouchTimer && !isCrouching) {

            crouchTimer = setTimeout(() => {

                isCrouching = true;

                keys.a = false;
                keys.d = false;

                character.src = images.crouch;

                character.style.transform =
                    "scaleX(1)";

                idleTime = 0;

                crouchTimer = null;

            }, 150);
        }

        // W jump
        if (key === "w" && isOnGround && !isCrouching) {

            velocityY = jumpPower;
            isOnGround = false;

            idleTime = 0;

            character.style.transform =
                "scaleX(1)";
        }

        // Space jump
        if (e.code === "Space" && isOnGround && !isCrouching) {

            velocityY = jumpPower;
            isOnGround = false;

            idleTime = 0;

            character.style.transform =
                "scaleX(1)";
        }
    });

    // -------------------------
    // KEY UP
    // -------------------------

    document.addEventListener("keyup", (e) => {

        const key = e.key.toLowerCase();

        if (key === "a") keys.a = false;
        if (key === "d") keys.d = false;
        if (key === "s") keys.s = false;
        if (key === "w") keys.w = false;

        if (e.code === "Space") {
            keys.space = false;
        }

        // Stop crouching
        if (key === "s") {

            if (crouchTimer) {

                clearTimeout(crouchTimer);
                crouchTimer = null;
            }

            if (isCrouching) {

                isCrouching = false;

                applyDirection(currentDirection);

                idleTime = 0;
            }
        }
    });

    update();
</script>

</body>
</html>
