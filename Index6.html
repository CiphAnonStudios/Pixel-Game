<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Testing</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            position: relative;
            background: #111;
            overflow: hidden;
        }

        #character {
            width: 300px;
            height: 50px;
            image-rendering: pixelated;
            user-select: none;
            -webkit-user-drag: none;
            position: absolute;
            left: 0;
            top: 0;
        }
    </style>
</head>

<body>

<img id="character" src="ToonyTimeForward.png" alt="Character"/>

<script>
    const character = document.getElementById("character");

    const images = {
        forward: "ToonyTimeForward.png",
        crouch: "ToonyTimeCrouch.png",
        right: "ToonyTimeTurn1.png"
    };

    let currentDirection = "forward";
    let isTurning = false;
    let isCrouching = false;
    let crouchTimer = null;

    let x = window.innerWidth / 2;
    let y = window.innerHeight - 300;
    let velocityY = 0;

    const speed = 4;
    const gravity = 0.8;
    const jumpPower = -16;
    const groundY = window.innerHeight - 300;

    const keys = {
        a: false,
        d: false,
        s: false,
        w: false,
        space: false
    };

    let isOnGround = true;

    // -------------------------
    // IDLE HEIGHT ANIMATION
    // -------------------------

    const normalHeight = 50;
    const idleMinHeight = 48;

    let idleTime = 0;

    function noButtonsPressed() {
        return (
            !keys.a &&
            !keys.d &&
            !keys.s &&
            !keys.w &&
            !keys.space
        );
    }

    function updateIdleHeight() {

        if (noButtonsPressed() && isOnGround && !isCrouching) {

            idleTime += 0.08;

            // Smoothly goes:
            // 50px -> 48px -> 50px -> 48px...
            const amount = (Math.sin(idleTime) + 1) / 2;

            const newHeight =
                normalHeight - (amount * (normalHeight - idleMinHeight));

            character.style.height = newHeight + "px";

        } else {

            // Anything being pressed:
            // immediately return to normal height.
            idleTime = 0;
            character.style.height = normalHeight + "px";
        }
    }

    function applyDirection(direction) {

        if (isCrouching) {
            character.src = images.crouch;
            character.style.transform = "scaleX(1)";
            return;
        }

        currentDirection = direction;

        if (direction === "left") {
            character.src = images.right;
            character.style.transform = "scaleX(-1)";
        } 
        else if (direction === "right") {
            character.src = images.right;
            character.style.transform = "scaleX(1)";
        } 
        else {
            character.src = images.forward;
            character.style.transform = "scaleX(1)";
        }
    }

    function setDirection(direction) {

        if (isTurning || isCrouching) return;

        const isSwitchingSide =
            (currentDirection === "left" && direction === "right") ||
            (currentDirection === "right" && direction === "left");

        if (isSwitchingSide) {

            isTurning = true;

            character.src = images.forward;
            character.style.transform = "scaleX(1)";

            setTimeout(() => {
                applyDirection(direction);
                isTurning = false;
            }, 16);

        } else {
            applyDirection(direction);
        }
    }

    function update() {

        // -------------------------
        // MOVEMENT
        // -------------------------

        if (!isCrouching) {

            if (keys.a) {
                x -= speed;
                setDirection("left");
            }

            if (keys.d) {
                x += speed;
                setDirection("right");
            }
        }

        // -------------------------
        // GRAVITY
        // -------------------------

        velocityY += gravity;
        y += velocityY;

        if (y >= groundY) {
            y = groundY;
            velocityY = 0;
            isOnGround = true;
        } else {
            isOnGround = false;
        }

        // -------------------------
        // IDLE IMAGE HEIGHT
        // -------------------------

        updateIdleHeight();

        // -------------------------
        // POSITION
        // -------------------------

        character.style.left = x + "px";
        character.style.top = y + "px";

        requestAnimationFrame(update);
    }

    // -------------------------
    // KEY DOWN
    // -------------------------

    document.addEventListener("keydown", (e) => {

        const key = e.key.toLowerCase();

        if (key === "a") keys.a = true;
        if (key === "d") keys.d = true;
        if (key === "s") keys.s = true;
        if (key === "w") keys.w = true;

        if (e.code === "Space") {
            keys.space = true;
        }

        // Crouch
        if (key === "s" && !crouchTimer && !isCrouching) {

            crouchTimer = setTimeout(() => {

                isCrouching = true;

                keys.a = false;
                keys.d = false;

                character.src = images.crouch;
                character.style.transform = "scaleX(1)";

                character.style.height = normalHeight + "px";

                crouchTimer = null;

            }, 150);
        }

        // W jump
        if (key === "w" && isOnGround && !isCrouching) {

            velocityY = jumpPower;
            isOnGround = false;

            character.style.height = normalHeight + "px";
        }

        // Space jump
        if (e.code === "Space" && isOnGround && !isCrouching) {

            velocityY = jumpPower;
            isOnGround = false;

            character.style.height = normalHeight + "px";
        }
    });

    // -------------------------
    // KEY UP
    // -------------------------

    document.addEventListener("keyup", (e) => {

        const key = e.key.toLowerCase();

        if (key === "a") keys.a = false;
        if (key === "d") keys.d = false;
        if (key === "s") keys.s = false;
        if (key === "w") keys.w = false;

        if (e.code === "Space") {
            keys.space = false;
        }

        // Stop crouching
        if (key === "s") {

            if (crouchTimer) {
                clearTimeout(crouchTimer);
                crouchTimer = null;
            }

            if (isCrouching) {

                isCrouching = false;

                applyDirection(currentDirection);

                character.style.height = normalHeight + "px";
            }
        }
    });

    update();
</script>

</body>
</html>
