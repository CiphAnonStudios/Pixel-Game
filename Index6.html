<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Testing</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            position: relative;
            background: #111;
            overflow: hidden;
        }

        #character {
            width: 300px;
            height: auto;
            image-rendering: pixelated;
            user-select: none;
            -webkit-user-drag: none;
            position: absolute;
            left: 0;
            top: 0;

            /*
             * The bottom stays in place when the image
             * gets slightly shorter.
             */
            transform-origin: bottom center;
        }
    </style>
</head>

<body>
test - 9
<img id="character" src="ToonyTimeForward.png" alt="Character"/>

<script>

const character = document.getElementById("character");

const images = {
    forward: "ToonyTimeForward.png",
    crouch: "ToonyTimeCrouch.png",
    right: "ToonyTimeTurn1.png"
};

let currentDirection = "forward";
let isTurning = false;
let isCrouching = false;
let crouchTimer = null;

let x = window.innerWidth / 2;
let y = window.innerHeight - 300;
let velocityY = 0;

const speed = 4;
const gravity = 0.8;
const jumpPower = -16;
const groundY = window.innerHeight - 300;

const keys = {
    a: false,
    d: false,
    s: false,
    w: false,
    space: false
};

let isOnGround = true;


/* =========================================================
   IDLE HEIGHT ANIMATION
   ========================================================= */

let idleTime = 0;

/*
 * How much shorter the image becomes.
 *
 * 0.015 = 1.5% shorter
 * 0.02  = 2% shorter
 *
 * Keep this small so the character doesn't look squashed.
 */
const idleSquash = 0.03;

/*
 * How fast the idle animation moves.
 */
const idleSpeed = 0.07;


/*
 * Checks whether absolutely no movement buttons
 * are currently being pressed.
 */
function noButtonsPressed() {

    return (
        !keys.a &&
        !keys.d &&
        !keys.s &&
        !keys.w &&
        !keys.space
    );
}


/*
 * Updates the image's vertical scale.
 *
 * The image gets slightly shorter while idle.
 * Because transform-origin is bottom center,
 * the bottom stays exactly where it was.
 */
function updateIdleAnimation() {

    if (
        noButtonsPressed() &&
        isOnGround &&
        !isCrouching
    ) {

        idleTime += idleSpeed;

        /*
         * Smooth wave from 0 → 1 → 0.
         */
        const wave =
            (Math.sin(idleTime) + 1) / 2;

        /*
         * 1.0 = normal height
         *
         * 0.985 = slightly shorter
         */
        const scaleY =
            1 - (wave * idleSquash);

        applyTransform(scaleY);

    } else {

        /*
         * The moment the player moves,
         * jumps, crouches, etc., return to
         * the exact normal image height.
         */
        idleTime = 0;

        applyTransform(1);
    }
}


/*
 * Handles BOTH:
 *
 * - Left/right flipping
 * - Idle vertical squash
 *
 * This prevents the idle animation from
 * breaking your existing turning system.
 */
function applyTransform(scaleY = 1) {

    let scaleX = 1;

    if (currentDirection === "left") {
        scaleX = -1;
    }

    character.style.transform =
        `scale(${scaleX}, ${scaleY})`;
}


/* =========================================================
   DIRECTION SYSTEM
   ========================================================= */

function applyDirection(direction) {

    if (isCrouching) {

        character.src = images.crouch;

        currentDirection = direction;

        /*
         * Crouching always faces normally.
         */
        character.style.transform =
            "scale(1, 1)";

        return;
    }

    currentDirection = direction;

    if (direction === "left") {

        character.src = images.right;

        applyTransform(1);

    } else if (direction === "right") {

        character.src = images.right;

        applyTransform(1);

    } else {

        character.src = images.forward;

        applyTransform(1);
    }
}


function setDirection(direction) {

    if (isTurning || isCrouching) return;

    const isSwitchingSide =
        (currentDirection === "left" && direction === "right") ||
        (currentDirection === "right" && direction === "left");

    if (isSwitchingSide) {

        isTurning = true;

        character.src = images.forward;

        character.style.transform =
            "scale(1, 1)";

        setTimeout(() => {

            applyDirection(direction);

            isTurning = false;

        }, 16);

    } else {

        applyDirection(direction);
    }
}


/* =========================================================
   MAIN UPDATE LOOP
   ========================================================= */

function update() {

    /*
     * MOVEMENT
     */

    if (!isCrouching) {

        if (keys.a) {

            x -= speed;

            setDirection("left");
        }

        if (keys.d) {

            x += speed;

            setDirection("right");
        }
    }


    /*
     * GRAVITY
     */

    velocityY += gravity;

    y += velocityY;


    /*
     * GROUND
     */

    if (y >= groundY) {

        y = groundY;

        velocityY = 0;

        isOnGround = true;

    } else {

        isOnGround = false;
    }


    /*
     * POSITION
     *
     * The Y position NEVER changes because
     * of the idle animation.
     */
    character.style.left = x + "px";

    character.style.top = y + "px";


    /*
     * IDLE HEIGHT
     */

    updateIdleAnimation();


    requestAnimationFrame(update);
}


/* =========================================================
   KEY DOWN
   ========================================================= */

document.addEventListener("keydown", (e) => {

    const key = e.key.toLowerCase();


    /*
     * A / D
     */

    if (key === "a") {

        keys.a = true;
    }

    if (key === "d") {

        keys.d = true;
    }


    /*
     * S / CROUCH
     */

    if (
        key === "s" &&
        !crouchTimer &&
        !isCrouching
    ) {

        crouchTimer = setTimeout(() => {

            isCrouching = true;

            keys.a = false;
            keys.d = false;

            character.src = images.crouch;

            character.style.transform =
                "scale(1, 1)";

            idleTime = 0;

            crouchTimer = null;

        }, 150);
    }


    /*
     * W / JUMP
     */

    if (
        key === "w" &&
        isOnGround &&
        !isCrouching
    ) {

        velocityY = jumpPower;

        isOnGround = false;

        idleTime = 0;
    }


    /*
     * SPACE / JUMP
     */

    if (
        e.code === "Space" &&
        isOnGround &&
        !isCrouching
    ) {

        velocityY = jumpPower;

        isOnGround = false;

        idleTime = 0;
    }


    /*
     * Space is also tracked so the idle
     * animation knows a button is being held.
     */

    if (e.code === "Space") {

        keys.space = true;
    }
});


/* =========================================================
   KEY UP
   ========================================================= */

document.addEventListener("keyup", (e) => {

    const key = e.key.toLowerCase();


    /*
     * A / D
     */

    if (key === "a") {

        keys.a = false;
    }

    if (key === "d") {

        keys.d = false;
    }


    /*
     * W
     */

    if (key === "w") {

        keys.w = false;
    }


    /*
     * SPACE
     */

    if (e.code === "Space") {

        keys.space = false;
    }


    /*
     * S / CROUCH
     */

    if (key === "s") {

        keys.s = false;

        if (crouchTimer) {

            clearTimeout(crouchTimer);

            crouchTimer = null;
        }


        if (isCrouching) {

            isCrouching = false;

            applyDirection(currentDirection);

            idleTime = 0;
        }
    }
});


/* =========================================================
   START
   ========================================================= */

update();

</script>

</body>
</html>
