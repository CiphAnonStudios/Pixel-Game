<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Testing</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        position: relative;
        background: #111;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    #character {
        width: 300px;
        height: auto;
        image-rendering: pixelated;
        user-select: none;
        -webkit-user-drag: none;
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: bottom center;
        z-index: 5;
    }

    /*
       This is the real collision area.
       It is smaller than the character image so the image
       can get close to blocks without activating them.
    */
    #characterHitbox {
        position: absolute;
        width: 70px;
        height: 25px;
        pointer-events: none;
        z-index: 10;
    }

    .gameBlock {
        position: absolute;
        width: 50px;
        height: 50px;
        z-index: 2;
    }

    #uiBlock {
        left: 120px;
        background: blue;
    }

    #bounceBlock {
        left: 450px;
        background: green;
    }

    #damageBlock {
        left: 780px;
        background: red;
    }

    #interactionButton {
        display: none;
        position: fixed;
        left: 50%;
        bottom: 30px;
        transform: translateX(-50%);
        z-index: 20;
        padding: 12px 20px;
        color: white;
        background: blue;
        border: 2px solid white;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }

    #gameUI {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 30;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.75);
    }

    #uiPanel {
        position: relative;
        width: min(80%, 600px);
        min-height: 300px;
        padding: 40px;
        box-sizing: border-box;
        color: white;
        background: #202b3d;
        border: 4px solid blue;
        border-radius: 12px;
        text-align: center;
    }

    #closeUI {
        position: absolute;
        top: 10px;
        right: 12px;
        width: 38px;
        height: 38px;
        color: white;
        background: red;
        border: 2px solid white;
        border-radius: 6px;
        font-size: 24px;
        line-height: 30px;
        cursor: pointer;
    }

    #damageFlash {
        position: fixed;
        inset: 0;
        z-index: 25;
        pointer-events: none;
        border: 0 solid rgba(255, 0, 0, 0);
        box-sizing: border-box;
    }

    #damageFlash.active {
        animation: damageFlashAnimation 0.35s ease-out;
    }

    @keyframes damageFlashAnimation {
        0% {
            border-width: 0;
            border-color: rgba(255, 0, 0, 0);
        }

        35% {
            border-width: 35px;
            border-color: rgba(255, 0, 0, 0.95);
        }

        100% {
            border-width: 12px;
            border-color: rgba(255, 0, 0, 0);
        }
    }

    .ground {
        height: 25px;
        width: auto;
    }
</style>
</head>
<body>
<img id="character" src="ToonyTimeForward.png" alt="Character"/>
<div id="characterHitbox"></div>
<div id="uiBlock" class="gameBlock"></div>
<div id="bounceBlock" class="gameBlock"></div>
<div id="damageBlock" class="gameBlock"></div>
<img class="ground" src="ground.png">
<button id="interactionButton">
    Press X to interact
</button>
<div id="damageFlash"></div>
<div id="gameUI">
    <div id="uiPanel">
        <button id="closeUI" aria-label="Close">×</button>
        <h1>UI Box</h1>
        <p>You opened the blue interaction block.</p>
        <p>Press the × button or Escape to close this window.</p>
    </div>
</div>
<script>
const character = document.getElementById("character");
const characterHitbox = document.getElementById("characterHitbox");

const uiBlock = document.getElementById("uiBlock");
const bounceBlock = document.getElementById("bounceBlock");
const damageBlock = document.getElementById("damageBlock");

const interactionButton = document.getElementById("interactionButton");
const gameUI = document.getElementById("gameUI");
const closeUI = document.getElementById("closeUI");
const damageFlash = document.getElementById("damageFlash");

const images = {
    forward: "ToonyTimeForward.png",
    crouch: "ToonyTimeCrouch.png",
    right: "ToonyTimeTurn1.png"
};

let currentDirection = "forward";
let isTurning = false;
let isCrouching = false;
let crouchTimer = null;

let x = window.innerWidth / 2;
let y = window.innerHeight - 300;
let velocityY = 0;

const speed = 4;
const gravity = 0.8;
const jumpPower = -16;
const bouncePower = -28;

let groundY = window.innerHeight - 300;

const keys = {
    a: false,
    d: false,
    s: false,
    w: false,
    space: false
};

let isOnGround = true;
let isTouchingUIBlock = false;
let isTouchingDamageBlock = false;
let damageFlashTimeout = null;


/* =========================================================
   BLOCK POSITIONING
   ========================================================= */

function positionBlocks() {
    const blockY = window.innerHeight - 200;

    uiBlock.style.top = blockY + "px";
    bounceBlock.style.top = blockY + "px";
    damageBlock.style.top = blockY + "px";
}

positionBlocks();

window.addEventListener("resize", () => {
    groundY = window.innerHeight - 300;
    positionBlocks();
});


/* =========================================================
   COLLISION HELPERS
   ========================================================= */

function updateCharacterHitbox() {
    /*
       The hitbox is positioned near the character's feet.
       Change hitboxWidth or hitboxHeight to make collisions
       stricter or looser.
    */
    const hitboxWidth = 70;
    const hitboxHeight = 25;

    characterHitbox.style.left =
        (x + character.offsetWidth / 2 - hitboxWidth / 2) + "px";

    characterHitbox.style.top =
        (y + character.offsetHeight - hitboxHeight) + "px";
}

function getCharacterHitboxRect() {
    return characterHitbox.getBoundingClientRect();
}

function getBlockRect(block) {
    return block.getBoundingClientRect();
}

function rectanglesOverlap(rect1, rect2) {
    return (
        rect1.left < rect2.right &&
        rect1.right > rect2.left &&
        rect1.top < rect2.bottom &&
        rect1.bottom > rect2.top
    );
}

function isCharacterInsideBlock(block) {
    return rectanglesOverlap(
        getCharacterHitboxRect(),
        getBlockRect(block)
    );
}

function isStandingOnBlock(block) {
    const characterRect = getCharacterHitboxRect();
    const blockRect = getBlockRect(block);

    const horizontalOverlap =
        characterRect.right > blockRect.left &&
        characterRect.left < blockRect.right;

    const feetAreOnBlock =
        characterRect.bottom >= blockRect.top - 8 &&
        characterRect.bottom <= blockRect.top + 8;

    return horizontalOverlap && feetAreOnBlock && velocityY >= 0;
}


/* =========================================================
   UI BLOCK
   ========================================================= */

function openUI() {
    gameUI.style.display = "flex";
}

function closeUIWindow() {
    gameUI.style.display = "none";
}

function updateInteractionButton() {
    isTouchingUIBlock = isCharacterInsideBlock(uiBlock);

    interactionButton.style.display =
        isTouchingUIBlock && gameUI.style.display !== "flex"
            ? "block"
            : "none";
}

interactionButton.addEventListener("click", openUI);

closeUI.addEventListener("click", closeUIWindow);

gameUI.addEventListener("click", (event) => {
    if (event.target === gameUI) {
        closeUIWindow();
    }
});


/* =========================================================
   DAMAGE BLOCK
   ========================================================= */

function showDamageFlash() {
    damageFlash.classList.remove("active");

    void damageFlash.offsetWidth;

    damageFlash.classList.add("active");

    clearTimeout(damageFlashTimeout);

    damageFlashTimeout = setTimeout(() => {
        damageFlash.classList.remove("active");
    }, 350);
}

function updateDamageBlock() {
    const touchingDamageBlock =
        isCharacterInsideBlock(damageBlock);

    if (touchingDamageBlock && !isTouchingDamageBlock) {
        showDamageFlash();
    }

    isTouchingDamageBlock = touchingDamageBlock;
}


/* =========================================================
   BOUNCE BLOCK
   ========================================================= */

function updateBounceBlock() {
    if (isStandingOnBlock(bounceBlock)) {
        velocityY = bouncePower;
        isOnGround = false;
    }
}


/* =========================================================
   IDLE HEIGHT ANIMATION
   ========================================================= */

let idleTime = 0;
const idleSquash = 0.03;
const idleSpeed = 0.07;

function noButtonsPressed() {
    return (
        !keys.a &&
        !keys.d &&
        !keys.s &&
        !keys.w &&
        !keys.space
    );
}

function updateIdleAnimation() {
    if (
        noButtonsPressed() &&
        isOnGround &&
        !isCrouching
    ) {
        idleTime += idleSpeed;

        const wave =
            (Math.sin(idleTime) + 1) / 2;

        const scaleY =
            1 - (wave * idleSquash);

        applyTransform(scaleY);
    } else {
        idleTime = 0;
        applyTransform(1);
    }
}

function applyTransform(scaleY = 1) {
    let scaleX = 1;

    if (currentDirection === "left") {
        scaleX = -1;
    }

    character.style.transform =
        `scale(${scaleX}, ${scaleY})`;
}


/* =========================================================
   DIRECTION SYSTEM
   ========================================================= */

function applyDirection(direction) {
    if (isCrouching) {
        character.src = images.crouch;
        currentDirection = direction;
        character.style.transform = "scale(1, 1)";
        return;
    }

    currentDirection = direction;

    if (direction === "left") {
        character.src = images.right;
        applyTransform(1);
    } else if (direction === "right") {
        character.src = images.right;
        applyTransform(1);
    } else {
        character.src = images.forward;
        applyTransform(1);
    }
}

function setDirection(direction) {
    if (isTurning || isCrouching) return;

    const isSwitchingSide =
        (currentDirection === "left" && direction === "right") ||
        (currentDirection === "right" && direction === "left");

    if (isSwitchingSide) {
        isTurning = true;

        character.src = images.forward;
        character.style.transform = "scale(1, 1)";

        setTimeout(() => {
            applyDirection(direction);
            isTurning = false;
        }, 16);
    } else {
        applyDirection(direction);
    }
}


/* =========================================================
   MAIN UPDATE LOOP
   ========================================================= */

function update() {
    if (gameUI.style.display !== "flex" && !isCrouching) {
        if (keys.a) {
            x -= speed;
            setDirection("left");
        }

        if (keys.d) {
            x += speed;
            setDirection("right");
        }
    }

/*
Allow the character to walk outside the screen
*/
    
    /*
    x = Math.max(
        0,
        Math.min(x, window.innerWidth - character.offsetWidth)
    );
    */

    velocityY += gravity;
    y += velocityY;

    if (y >= groundY) {
        y = groundY;
        velocityY = 0;
        isOnGround = true;
    } else {
        isOnGround = false;
    }

    character.style.left = x + "px";
    character.style.top = y + "px";

    updateCharacterHitbox();

    updateBounceBlock();
    updateInteractionButton();
    updateDamageBlock();
    updateIdleAnimation();

    requestAnimationFrame(update);
}


/* =========================================================
   KEY DOWN
   ========================================================= */

document.addEventListener("keydown", (e) => {
    const key = e.key.toLowerCase();

    if (key === "a") {
        keys.a = true;
    }

    if (key === "d") {
        keys.d = true;
    }

    if (key === "s") {
        keys.s = true;

        if (!crouchTimer && !isCrouching) {
            crouchTimer = setTimeout(() => {
                isCrouching = true;

                keys.a = false;
                keys.d = false;

                character.src = images.crouch;
                character.style.transform = "scale(1, 1)";

                idleTime = 0;
                crouchTimer = null;
            }, 150);
        }
    }

    if (key === "w") {
        keys.w = true;

        if (
            isOnGround &&
            !isCrouching &&
            gameUI.style.display !== "flex"
        ) {
            velocityY = jumpPower;
            isOnGround = false;
            idleTime = 0;
        }
    }

    if (e.code === "Space") {
        e.preventDefault();
        keys.space = true;

        if (
            isOnGround &&
            !isCrouching &&
            gameUI.style.display !== "flex"
        ) {
            velocityY = jumpPower;
            isOnGround = false;
            idleTime = 0;
        }
    }

    if (key === "x" && isTouchingUIBlock) {
        openUI();
    }

    if (key === "escape") {
        closeUIWindow();
    }
});


/* =========================================================
   KEY UP
   ========================================================= */

document.addEventListener("keyup", (e) => {
    const key = e.key.toLowerCase();

    if (key === "a") {
        keys.a = false;
    }

    if (key === "d") {
        keys.d = false;
    }

    if (key === "w") {
        keys.w = false;
    }

    if (e.code === "Space") {
        keys.space = false;
    }

    if (key === "s") {
        keys.s = false;

        if (crouchTimer) {
            clearTimeout(crouchTimer);
            crouchTimer = null;
        }

        if (isCrouching) {
            isCrouching = false;
            applyDirection(currentDirection);
            idleTime = 0;
        }
    }
});


/* =========================================================
   START
   ========================================================= */

update();
</script>
</body>
</html>
