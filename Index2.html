<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Testing</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            position: relative;
            background: #111;
            overflow: hidden;
        }

        #character {
            width: 300px;
            height: auto;
            image-rendering: pixelated;
            user-select: none;
            -webkit-user-drag: none;
            transition: none;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <img id="character" src="ToonyTimeForward.png" alt="Character"/>

    <script>
        const character = document.getElementById("character");

        const images = {
            forward: "ToonyTimeForward.png",
            right: "ToonyTimeTurn1.png"
        };

        let currentDirection = "forward";
        let isTurning = false;
        let x = window.innerWidth / 2;
        const speed = 5;

        function updatePosition() {
            character.style.left = x + "px";
        }

        function applyDirection(direction) {
            currentDirection = direction;

            if (direction === "left") {
                character.src = images.right;
                character.style.transform = "translate(-50%, -50%) scaleX(-1)";
            } else if (direction === "right") {
                character.src = images.right;
                character.style.transform = "translate(-50%, -50%) scaleX(1)";
            } else {
                character.src = images.forward;
                character.style.transform = "translate(-50%, -50%) scaleX(1)";
            }
        }

        function setDirection(direction) {
            if (isTurning) return;

            const isSwitchingSide =
                (currentDirection === "left" && direction === "right") ||
                (currentDirection === "right" && direction === "left");

            if (isSwitchingSide) {
                isTurning = true;
                character.src = images.forward;
                character.style.transform = "translate(-50%, -50%) scaleX(1)";

                setTimeout(() => {
                    applyDirection(direction);
                    isTurning = false;
                }, 16);
            } else {
                applyDirection(direction);
            }
        }

        document.addEventListener("keydown", (e) => {
            const key = e.key.toLowerCase();

            if (key === "a") {
                x -= speed;
                updatePosition();
                setDirection("left");
            }

            if (key === "d") {
                x += speed;
                updatePosition();
                setDirection("right");
            }

            if (key === "s") setDirection("forward");
        });
    </script>
</body>
</html>
